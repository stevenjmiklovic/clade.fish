name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump: patch, minor, major, or an exact X.Y.Z"
        required: true
        default: patch
        type: string
      dry-run:
        description: "Dry run: show the release without committing, tagging or publishing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are cut from main, not ${{ github.ref_name }}."
          exit 1
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install fish 4
        run: |
          sudo apt-add-repository -y ppa:fish-shell/release-4
          sudo apt-get update
          sudo apt-get install -y fish
      - name: Bump version and changelog
        id: bump
        env:
          BUMP: ${{ inputs.version }}
        run: |
          version=$(fish tools/release.fish "$BUMP" --notes "$RUNNER_TEMP/notes.md")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '\n## Install\n\n```fish\nomf install https://github.com/%s\n```\n' "$GITHUB_REPOSITORY" >> "$RUNNER_TEMP/notes.md"
          git diff
      - name: Summary
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          {
            if [ "$DRY_RUN" = true ]; then echo "# Dry run: v$VERSION (nothing was published)"; else echo "# Released v$VERSION"; fi
            echo
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo '```diff'
            git diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit (signed by GitHub), tag and publish
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # Commit through the GraphQL API so GitHub signs it: a commit pushed from Actions with git is unsigned.
          additions=$(git diff --name-only | while read -r f; do
            jq -n --arg path "$f" --arg contents "$(base64 -w0 "$f")" '{path: $path, contents: $contents}'
          done | jq -s .)
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg head "$(git rev-parse HEAD)" \
            --arg headline "Release v$VERSION" --argjson additions "$additions" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: "main"}, expectedHeadOid: $head,
                                  message: {headline: $headline}, fileChanges: {additions: $additions}}}}' >"$RUNNER_TEMP/commit.json"
          oid=$(gh api graphql --input "$RUNNER_TEMP/commit.json" --jq '.data.createCommitOnBranch.commit.oid // empty')
          if [ -z "$oid" ]; then echo "Could not create the release commit."; exit 1; fi
          verified=$(gh api "repos/$GITHUB_REPOSITORY/commits/$oid" --jq '.commit.verification.verified')
          echo "Release commit $oid, signature verified: $verified"
          if [ "$verified" != true ]; then echo "The release commit is not signed; not publishing."; exit 1; fi
          gh release create "v$VERSION" --target "$oid" --title "clade $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
