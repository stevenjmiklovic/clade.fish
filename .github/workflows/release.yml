name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump: patch, minor, major, or an exact X.Y.Z"
        required: true
        default: patch
        type: string
      dry-run:
        description: "Dry run: show the release without committing, tagging or publishing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are cut from main, not ${{ github.ref_name }}."
          exit 1
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install fish 4
        run: |
          sudo apt-add-repository -y ppa:fish-shell/release-4
          sudo apt-get update
          sudo apt-get install -y fish
      - name: Bump version and changelog
        id: bump
        env:
          BUMP: ${{ inputs.version }}
        run: |
          version=$(fish tools/release.fish "$BUMP" --notes "$RUNNER_TEMP/notes.md")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '\n## Install\n\n```fish\nomf install https://github.com/%s\n```\n' "$GITHUB_REPOSITORY" >> "$RUNNER_TEMP/notes.md"
          git diff
      - name: Summary
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          {
            if [ "$DRY_RUN" = true ]; then echo "# Dry run: v$VERSION (nothing was published)"; else echo "# Released v$VERSION"; fi
            echo
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo '```diff'
            git diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit, tag and push
        if: ${{ !inputs.dry-run }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag -a "v$VERSION" -m "clade $VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
      - name: Publish GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "v$VERSION" --verify-tag --title "clade $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
